<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mot de passe oublié — SSIAP Training</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--terra:#c25a3a;--terra-d:#a34a2e;--terra-bg:#fdf0eb;--terra-mid:#e8d5cc;--bg:#f7f4f0;--surface:#fff;--border:#e8e2db;--text:#1e1a17;--muted:#8c8078;--subtle:#f0ece7;--green:#2e7d52;--green-bg:#e8f5ee;--red:#c0392b;--red-bg:#fdecea;--blue:#2e5c8a;--blue-bg:#e8f0f8;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);font-family:'Plus Jakarta Sans',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:44px;max-width:440px;width:100%;box-shadow:0 4px 24px rgba(0,0,0,.07)}
.logo{text-align:center;font-size:44px;margin-bottom:8px}
.title{font-family:'Lora',serif;font-size:24px;font-weight:700;color:var(--text);text-align:center;margin-bottom:6px}
.sub{font-size:13px;color:var(--muted);text-align:center;line-height:1.6;margin-bottom:28px}
.form-group{margin-bottom:18px}
.form-label{display:block;margin-bottom:6px;font-size:11px;font-weight:700;color:var(--text);text-transform:uppercase;letter-spacing:.5px}
.form-input{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:9px;font-size:14px;font-family:'Plus Jakarta Sans',sans-serif;color:var(--text);outline:none;transition:.15s}
.form-input:focus{border-color:var(--terra);box-shadow:0 0 0 3px var(--terra-bg)}
.btn{width:100%;padding:13px;background:var(--terra);color:#fff;border:none;border-radius:9px;font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{background:var(--terra-d)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.back-link{text-align:center;margin-top:16px;font-size:13px;color:var(--muted)}
.back-link a{color:var(--terra);font-weight:600;text-decoration:none}
.back-link a:hover{text-decoration:underline}
.alert{padding:12px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;display:none;border:1px solid}
.alert.show{display:block}
.alert.error{background:var(--red-bg);border-color:rgba(192,57,43,.25);color:var(--red)}
.alert.success{background:var(--green-bg);border-color:rgba(46,125,82,.25);color:var(--green)}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="card">
  <div class="logo">🔒</div>
  <div class="title">Mot de passe oublié</div>
  <div class="sub">Saisissez l'email de votre compte.<br>Nous vous enverrons un code de vérification à 6 chiffres.</div>

  <div class="alert" id="alert"></div>

  <div class="form-group">
    <label class="form-label">Email du compte</label>
    <input type="email" class="form-input" id="f-email" placeholder="contact@moncentre.fr" autofocus>
  </div>

  <button class="btn" id="btn-submit" onclick="submit()">
    📧 Envoyer le code
  </button>

  <div class="back-link">
    <a href="center-login.html">← Retour à la connexion</a>
  </div>
</div>

<script>
const API = window.location.hostname === 'localhost'
  ? 'http://localhost:10000/api'
  : 'https://ssiap-training-center.onrender.com/api';

document.getElementById('f-email').addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });

async function submit() {
  const email = document.getElementById('f-email').value.trim();
  if (!email) { showAlert('error', '⚠️ Veuillez saisir votre email.'); return; }

  const btn = document.getElementById('btn-submit');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Envoi en cours…';

  try {
    const r = await fetch(`${API}/center/forgot-password-otp`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    });
    const d = await r.json();

    // On affiche toujours le même message pour éviter l'énumération d'emails
    showAlert('success', '✅ Si cet email est enregistré, vous recevrez un code dans quelques secondes. Pensez à vérifier vos spams.');

    // Stocker l'email en session pour l'étape suivante
    sessionStorage.setItem('otp_email', email);

    // Rediriger après 2.5s
    setTimeout(() => { window.location.href = 'center-verify-otp.html'; }, 2500);

  } catch(e) {
    showAlert('error', '⚠️ Erreur réseau. Vérifiez votre connexion et réessayez.');
    btn.disabled = false;
    btn.innerHTML = '📧 Envoyer le code';
  }
}

function showAlert(type, msg) {
  const el = document.getElementById('alert');
  el.textContent = msg;
  el.className = `alert ${type} show`;
}
</script>
</body>
</html>
